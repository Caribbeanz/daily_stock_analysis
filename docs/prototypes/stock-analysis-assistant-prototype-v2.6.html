<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>股票分析助手 · 交互原型 v2.6（模拟数据）</title>
<style>
:root{
  --bg:#f3f6fa; --surface:#fff; --surface2:#f8fafc; --border:#e3e8f0; --border2:#eef1f6;
  --text:#1a2432; --text2:#5a6675; --text3:#8b95a4;
  --up:#d92d20; --up-bg:#fdeceb; --down:#0e9a6b; --down-bg:#e8f7f1; --flat:#8b95a4;
  --accent:#2563eb; --accent-bg:#eaf1ff; --ai:#7b5cd6; --ai-bg:#f2edff;
  --severe:#d92d20; --severe-bg:#fdeceb; --warn:#d98808; --warn-bg:#fff4e2; --observe:#8b95a4; --observe-bg:#f1f3f6;
  --radius:12px; --shadow:0 1px 3px rgba(20,32,55,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#e9edf4;color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:var(--accent);text-decoration:none}
.hidden{display:none !important}

/* ---------- 原型控制条（不属于产品界面） ---------- */
.proto-bar{position:sticky;top:0;z-index:60;background:#141c2b;color:#dfe7f2;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 18px;box-shadow:0 2px 12px rgba(0,0,0,.22)}
.proto-bar .brand{font-weight:700;color:#fff;font-size:13px;letter-spacing:.3px;margin-right:4px}
.proto-bar .fake{background:#b54708;color:#fff;border-radius:5px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.proto-bar .hint{font-size:11px;color:#95a5bd;margin-right:auto}
.seg{display:inline-flex;border:1px solid #3a465c;border-radius:7px;overflow:hidden}
.seg button{background:transparent;color:#c5d1e2;border:0;padding:5px 11px;font-size:11.5px;line-height:1.5}
.seg button.on{background:#3b74f0;color:#fff;font-weight:600}
.pbtn{background:#222d40;color:#d7e1f0;border:1px solid #3a465c;border-radius:7px;padding:5px 11px;font-size:11.5px}
.pbtn:hover{background:#2d3a52}
.pbtn.on{background:#3b74f0;border-color:#3b74f0;color:#fff}

/* ---------- 设备舞台 ---------- */
.stage{display:flex;justify-content:center;align-items:flex-start;padding:22px 16px 70px}
.device{width:1180px;max-width:100%;background:var(--bg);border:1px solid #d8dfe9;border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(24,38,62,.14);transition:width .25s ease,border-radius .25s ease}
.device.phone{width:392px;border:9px solid #1b2230;border-radius:30px;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.phone-status{display:none}
.device.phone .phone-status{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 4px;background:#fff;font-size:11px;font-weight:600;color:#223}
.device.phone .phone-notch{width:110px;height:5px;border-radius:6px;background:#d8dee8;margin:0 auto 4px}
.app-frame{container-name:app;container-type:inline-size;width:100%;background:var(--bg)}
.device.phone .app-frame{height:748px;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth}

/* ---------- 产品头 ---------- */
.app-head{background:#fff;border-bottom:1px solid var(--border);padding:12px 18px 0}
.app-head .title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.app-head h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
.app-head .sub{font-size:11.5px;color:var(--text3)}
.app-head .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.status-strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:9px 0 10px;font-size:11.5px;color:var(--text2)}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);background:var(--surface2);border-radius:6px;padding:2px 7px;font-size:11px;color:var(--text2);white-space:nowrap}
.chip.blue{background:var(--accent-bg);border-color:#d5e2ff;color:#1d4ed8}
.chip.ai{background:var(--ai-bg);border-color:#e2d8ff;color:#6742c4}
.chip.fake{background:#fff1e6;border-color:#ffd8b5;color:#a7500a}
.tabbar{display:flex;gap:4px;position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--border);padding:0 18px;box-shadow:0 2px 6px rgba(20,32,55,.03)}
.tab{position:relative;background:none;border:0;padding:11px 16px 10px;font-size:13.5px;color:var(--text2);border-bottom:2px solid transparent}
.tab.on{color:var(--accent);font-weight:700;border-bottom-color:var(--accent)}
.tab.disabled{color:#b4bcc8;cursor:not-allowed}
.tab .soon{margin-left:6px;font-size:10px;background:#f0f2f6;color:#98a2b2;border-radius:4px;padding:1px 5px;font-weight:500}

/* ---------- 通用块 ---------- */
.view{padding:15px 18px 30px;display:flex;flex-direction:column;gap:13px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative}
.card.tight{padding:12px 14px}
.card-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.card-h h2{font-size:14.5px;margin:0;font-weight:700}
.card-h h3{font-size:13px;margin:0;font-weight:700}
.card-h .desc{font-size:11px;color:var(--text3);font-weight:400}
.card-h .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.sec-label{font-size:11px;color:var(--text3);letter-spacing:.5px;font-weight:600;margin:2px 0 -4px}
.muted{color:var(--text2)}
.tiny{font-size:11.5px;color:var(--text3)}
.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:11.5px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.b{font-weight:700}
.divider{height:1px;background:var(--border2);margin:10px 0}
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:5px 10px;font-size:11.5px;color:var(--text2)}
.btn:hover{background:#eef2f8;color:var(--accent);border-color:#cdd9ee}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1d4ed8;color:#fff}
.btn.sm{padding:3px 8px;font-size:11px}
.term{border:0;background:none;padding:0;color:var(--accent);border-bottom:1px dashed #a8c0f5;font-size:inherit;font-weight:inherit}
.lv{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:5px;padding:2px 7px;white-space:nowrap}
.lv.severe{background:var(--severe-bg);color:var(--severe)}
.lv.warn{background:var(--warn-bg);color:var(--warn)}
.lv.observe{background:var(--observe-bg);color:#6b7585}
.lv.none{background:var(--observe-bg);color:#7b8595}
.pill{font-size:10.5px;border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--text2);background:var(--surface2);white-space:nowrap}
.pill.buy{background:var(--up-bg);border-color:#f6cfcb;color:var(--up)}
.pill.sell{background:var(--down-bg);border-color:#c9ebdc;color:var(--down)}
.pill.neutral{background:#f1f3f7;border-color:var(--border);color:var(--text2)}
.pill.state{background:#f4f5f8;border-color:#e0e4eb;color:#7c8695}
.pill.plan{background:var(--accent-bg);border-color:#d5e2ff;color:#1d4ed8}
.pill.ai{background:var(--ai-bg);border-color:#e2d8ff;color:#6742c4}

/* ---------- 阶段定位（§5.14） ---------- */
.stage-card{border-left:4px solid #cfd8e6}
.stage-card.s1{border-left-color:var(--up);background:linear-gradient(100deg,#fff8f7,#fff 46%)}
.stage-card.s2{border-left-color:var(--warn);background:linear-gradient(100deg,#fffbf3,#fff 46%)}
.stage-card.s3{border-left-color:var(--down);background:linear-gradient(100deg,#f4fbf8,#fff 46%)}
.stage-card.s4{border-left-color:var(--accent);background:linear-gradient(100deg,#f5f9ff,#fff 46%)}
.stage-card.s0{border-left-color:#b8c1cf;background:var(--surface2)}
.stage-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stage-badge{display:inline-flex;align-items:baseline;gap:7px;font-weight:800;letter-spacing:.2px}
.stage-badge .id{font-size:11.5px;font-weight:800;border-radius:5px;padding:2px 6px;background:#eef2f8;color:#54607a;letter-spacing:.5px}
.stage-badge .nm{font-size:19px}
.stage-card.s1 .stage-badge .id{background:var(--up-bg);color:var(--up)}
.stage-card.s2 .stage-badge .id{background:var(--warn-bg);color:var(--warn)}
.stage-card.s3 .stage-badge .id{background:var(--down-bg);color:var(--down)}
.stage-card.s4 .stage-badge .id{background:var(--accent-bg);color:#1d4ed8}
.stage-say{margin-top:9px;font-size:13px;line-height:1.75;background:#fff;border:1px dashed var(--border);border-radius:8px;padding:9px 11px}
.ev-list{margin:7px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.ev-list li{font-size:11.8px;color:var(--text2);line-height:1.55;padding-left:12px;position:relative}
.ev-list li::before{content:'·';position:absolute;left:3px;top:-2px;font-weight:800;color:#9aa6b8}
.playgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.playgrid .p{flex:1 1 200px;min-width:0;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:#fff}
.playgrid .p .k{font-size:10.5px;font-weight:800;letter-spacing:.4px;color:var(--text3)}
.playgrid .p .v{font-size:12.3px;line-height:1.6;margin-top:3px;color:var(--text)}
.playgrid .p.wide{flex:1 1 100%}
.playgrid .p.allow{background:#f6fbf9;border-color:#d7ece4}
.playgrid .p.deny{background:#fff7f6;border-color:#f4dedb}
.playgrid .p.next{background:var(--surface2)}
.stage-tag{font-size:10px;font-weight:700;border:1px solid var(--border);background:var(--surface2);color:var(--text2);border-radius:5px;padding:1px 5px;white-space:nowrap}
.stage-tag.s1{background:var(--up-bg);border-color:#f6cfcb;color:var(--up)}
.stage-tag.s2{background:var(--warn-bg);border-color:#f3ddb7;color:#a96b05}
.stage-tag.s3{background:var(--down-bg);border-color:#c9ebdc;color:var(--down)}
.stage-tag.s4{background:var(--accent-bg);border-color:#d5e2ff;color:#1d4ed8}

/* ---------- 浮动「回到页首」 ---------- */
.fab{position:fixed;z-index:80;width:46px;height:46px;border-radius:50%;border:1px solid #d5e2ff;background:#fff;
 color:#1d4ed8;box-shadow:0 6px 20px rgba(20,32,55,.18);display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:1px;padding:0;opacity:0;transform:translateY(10px);pointer-events:none;
 transition:opacity .18s ease,transform .18s ease,background .15s}
.fab .ar{font-size:15px;line-height:1;font-weight:800}
.fab .tx{font-size:9px;font-weight:700;letter-spacing:.5px}
.fab.on{opacity:1;transform:none;pointer-events:auto}
.fab:hover{background:#f3f7ff}
.fab:active{transform:scale(.94)}

/* 需求对照标注 */
[data-spec]{position:relative}
body.show-spec [data-spec]::before{content:attr(data-spec);position:absolute;top:-9px;right:8px;background:#334155;color:#fff;font-size:10px;line-height:1.4;padding:1px 6px;border-radius:4px;z-index:3;font-weight:600;letter-spacing:.2px}
body.show-spec [data-spec]{outline:1px dashed #c7d2e2}

/* ---------- 状态/风险条 ---------- */
.notice{border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.65}
.notice.blue{background:var(--accent-bg);border:1px solid #d5e2ff;color:#204494}
.notice.gray{background:var(--surface2);border:1px solid var(--border);color:var(--text2)}
.notice.warn{background:#fffaf0;border:1px solid #f6e2bb;color:#8a5b0c}
.notice.ai{background:var(--ai-bg);border:1px solid #e2d8ff;color:#5b3eae}
.risk-bar{background:#fff;border:1px solid #f0d5d2;border-radius:var(--radius);padding:0;overflow:hidden}
.risk-bar .rb-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff7f6;border-bottom:1px solid #f6e3e1;font-size:13px;font-weight:700;color:#a3271d}
.risk-item{display:flex;gap:9px;align-items:flex-start;padding:9px 14px;border-bottom:1px solid var(--border2);cursor:pointer;font-size:12.3px;background:#fff}
.risk-item:last-child{border-bottom:0}
.risk-item:hover{background:#fafbfd}
.risk-item .rb-txt{flex:1;line-height:1.55}
.risk-item .rb-meta{font-size:10.8px;color:var(--text3);margin-top:2px}
.risk-item .arrow{color:#b6bfcc;font-size:15px;align-self:center}

/* ---------- 指数 / 指标 ---------- */
.idx-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
.idx{min-width:210px;flex:1;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface2)}
.idx.main{background:linear-gradient(135deg,#fff6f5,#fff);border-color:#f2d6d3}
.idx .nm{font-size:11.5px;color:var(--text2);display:flex;justify-content:space-between}
.idx .v{font-size:21px;font-weight:700;letter-spacing:.4px;line-height:1.35}
.idx .p{font-size:12.5px;font-weight:700}
.grid{display:grid;gap:9px}
.g6{grid-template-columns:repeat(6,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.metric{border:1px solid var(--border);border-radius:9px;padding:9px 10px;background:var(--surface2);min-width:0}
.metric .k{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric .v{font-size:16px;font-weight:700;margin:2px 0 1px;white-space:nowrap}
.metric .s{font-size:10.5px;color:var(--text3)}
.metric .tech-toggle{margin-top:4px}
.tech-toggle{border:0;background:none;padding:0;color:var(--accent);font-size:10.8px;line-height:1.5}
.tech-toggle:hover{text-decoration:underline}
.tech-body{background:#f7f9fd;border:1px dashed #d4deee;border-radius:8px;padding:9px 11px;margin-top:7px;font-size:11.5px;color:var(--text2);line-height:1.7}
.tech-body .l1{color:var(--text);font-size:12px;margin-bottom:6px}
.tech-full{margin-top:7px;border-top:1px solid #dde5f2;padding-top:7px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:3px 8px;font-size:11px}
.kv .k{color:var(--text3)}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.quad .q{border:1px solid var(--border);background:var(--surface2);border-radius:8px;padding:7px 9px;font-size:11px;color:var(--text2)}
.quad .q.on{background:var(--accent-bg);border-color:#b9cffb;color:#1d4ed8;font-weight:700;box-shadow:inset 0 0 0 1px #b9cffb}
.quad .q b{display:block;font-size:12px;color:inherit}
.regime-box{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.regime-main{flex:1 1 260px}
.regime-tag{display:inline-block;background:var(--accent-bg);color:#1d4ed8;border:1px solid #cddcff;border-radius:8px;padding:5px 12px;font-size:17px;font-weight:800}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}

/* ---------- 板块 ---------- */
.sector-card{border:1px solid var(--border);border-radius:var(--radius);background:#fff;padding:12px 14px}
.sector-card .sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sector-card .sh b{font-size:14px}
.sector-card .line{font-size:12.2px;color:var(--text2);margin-top:7px;line-height:1.65}
.sector-card .line .k{color:var(--text3);font-size:11.5px;display:inline-block;min-width:66px}
.sector-card .r7{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:8px 10px;margin-top:9px;font-size:11.8px;color:var(--text2);line-height:1.7}
.rel-bar{margin-top:9px;border-top:1px dashed var(--border);padding-top:8px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.rel-link{border:1px solid var(--border);background:#fafbfe;border-radius:6px;padding:3px 8px;font-size:11.5px;color:var(--accent)}
.rel-link:hover{background:var(--accent-bg)}

/* ---------- 列表 ---------- */
.portfolio{display:flex;gap:10px;flex-wrap:wrap}
.pf{flex:1 1 150px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:9px 11px}
.pf .k{font-size:11px;color:var(--text3)}
.pf .v{font-size:16px;font-weight:700}
.pf .s{font-size:10.5px;color:var(--text3)}
.todo-head{display:flex;align-items:center;gap:8px;background:#fff8f1;border:1px solid #f4dfc2;border-radius:10px;padding:10px 13px;font-size:13px;font-weight:700;color:#8a5b0c}
.list-head,.stock-row{display:grid;grid-template-columns:minmax(170px,1.7fr) 96px 92px minmax(120px,1.1fr) 132px;gap:10px;align-items:center}
.list-head{padding:0 13px 6px;font-size:11px;color:var(--text3);letter-spacing:.3px}
.stock-row{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 13px;cursor:pointer;transition:box-shadow .15s,border-color .15s;margin-bottom:7px}
.stock-row:hover{border-color:#b8cdf7;box-shadow:0 3px 12px rgba(37,99,235,.1)}
.stock-row.state-row{background:#fbfcfe}
.s-name{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.s-name .code{font-weight:400;color:var(--text3);font-size:11.5px;font-family:"SFMono-Regular",Consolas,monospace}
.s-price{text-align:right;font-weight:700;font-size:14px}
.s-pct{text-align:right;font-weight:700;font-size:13px}
.s-advice{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.s-tags{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.stock-row .sub{font-size:10.8px;color:var(--text3);font-weight:400}

/* ---------- 详情 ---------- */
.crumb{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3);flex-wrap:wrap}
.hero-name{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.hero-name b{font-size:20px}
.hero-name .code{font-family:"SFMono-Regular",Consolas,monospace;color:var(--text3);font-size:13px}
.human{background:linear-gradient(135deg,#f6f3ff,#fff);border:1px solid #e4dbff;border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.7;color:#3c2d70}
.ohlc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center}
.ohlc div{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:7px 4px}
.ohlc .k{font-size:10.5px;color:var(--text3)}
.ohlc .v{font-size:13.5px;font-weight:700}
.advice-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid #d8e2f6;border-radius:10px;background:var(--accent-bg);padding:11px 13px}
.advice-box .main{font-size:20px;font-weight:800;color:#1d4ed8}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.four .f{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:9px 10px}
.four .f .k{font-size:11px;color:var(--text3)}
.four .f .v{font-size:14px;font-weight:700;margin-top:2px}
.four .f .s{font-size:10.5px;color:var(--text3)}

/* 条件计划 */
.plan-intro{font-size:12.5px;background:var(--accent-bg);border:1px solid #d5e2ff;border-radius:8px;padding:9px 11px;color:#204494;line-height:1.7}
.branch{border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:10px 12px;background:#fff;margin-bottom:8px}
.branch.act-buy{border-left-color:var(--up)}
.branch.act-sell{border-left-color:var(--down)}
.branch.act-none{border-left-color:#b6c0cf;background:#fcfdff}
.branch .bh{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.branch .bh b{font-size:13px}
.branch .bh .right{margin-left:auto;display:flex;gap:5px;align-items:center}
.brow{display:grid;grid-template-columns:82px 1fr;gap:4px 9px;font-size:12px;padding:2px 0;line-height:1.6}
.brow .k{color:var(--text3);font-size:11px}
.brow .v{word-break:break-word}
.brow .v b{font-size:13px}
.check-ok{color:var(--down);font-weight:700}
.check-no{color:var(--up);font-weight:700}
.combo-check{background:#fffaf0;border:1px solid #f2ddb6;border-radius:9px;padding:10px 12px;font-size:12.2px;line-height:1.75;color:#7d5710}

.fold>.fh .right{margin-left:auto;font-size:11px;color:var(--text3);font-weight:400}
.fold>.fb{padding:10px 12px;font-size:12px;color:var(--text2);line-height:1.75}
.dim-row{display:flex;gap:8px;padding:6px 0;border-bottom:1px dashed var(--border2)}
.dim-row:last-child{border-bottom:0}
.dim-row .dk{flex:0 0 92px;font-weight:700;color:var(--text)}
.dim-row .dv{flex:1}

.risk-table{border:1px solid var(--border);border-radius:9px;overflow:hidden}
.rt-head,.rt-row{display:grid;grid-template-columns:70px 132px 1.3fr 84px 76px 1fr;gap:8px;align-items:start}

.rt-row.severe{background:#fffafa}
.rt-row .human{grid-column:1/-1;background:none;border:0;padding:5px 0 0;font-size:11.8px;color:var(--text2);line-height:1.6}

/* ---------- 术语词典（附录 B） ---------- */
const GLOSSARY={
  'MA20':'MA20＝最近 20 个交易日的收盘价平均值。它是一条「平均成本线」：价格在上方说明近 20 天买入的人多数还在赚钱；在下方则相反。本助手只看它在上方 / 下方 / 附近三种状态，不预测方向。',
  '分位':'分位＝把一段历史数据从小到大排队，当前值排在什么位置。例如「PE 分位 19%」表示当前估值比过去 81% 的时间都便宜。注意：价格分位（价格位置）与估值分位（PE/PB 位置）是两套不同口径，不能混用。',
  '箱体':'箱体＝价格在某一段时间内反复震荡的上下边界。上边界常称压力，下边界常称支撑。缠论里最接近的概念叫「中枢」，本助手只做简化的箱体判定（重叠区间 + 触碰次数），不做级别递归。触发价可能来自箱体边界，但条件单里只写具体价格，不写「箱体」这个词。',
  'T 仓':'T 仓＝专门用于做 T（当日内低买高卖或高卖低买）的一小部分仓位，不动中长期底仓。本项目硬上限为总资金的 10%，且同时计入单只 20% 与总仓 80% 上限。',
  '失效位':'失效位＝判断「原来的趋势判断不算数了」的参考价格。跌破它不等于立刻清仓：本助手采用分级止损 L1 先减一部分、L2 继续下跌才清仓，以便留住分红底仓。',
  '股息率':'股息率＝每股分红 ÷ 当前股价。它衡量「光靠分红能拿回多少」，是分红兜底逻辑的核心指标。分红中断会直接触发严重级风险信号。',
  '估值分位':'估值分位＝当前 PE 或 PB 在历史序列中的百分位位置，回答「贵不贵」。与「价格位置」分别标注：价格低不代表估值低，估值低也不代表马上会涨。',
  '量能比':'量能比＝当日成交量 ÷ 过去 N 日平均成交量。≥1.1 为放量、≤0.9 为缩量。本项目只把它当第 3 因子的确认标注，不参与环境评级的硬判定。',
  'RSI':'RSI（相对强弱指标）＝用一段时间内涨幅与跌幅的比例衡量买卖力量，取值 0–100。通常 70 以上偏热、30 以下偏冷，本助手只作辅助展示档位。',
  '不复权':'不复权＝直接使用交易所原始收盘价，不因分红送股调整历史价格。展示价与条件单触发价都用不复权，保证你挂单的价格和页面看到的数字完全一致。',
  '三元组':'一致性三元组＝[data_date, snapshot_id, calc_version]。页面、飞书推送、导出卡片必须三者完全一致；不一致时统一显示「待同步」，绝不用旧结论顶替。',
  '条件单':'条件单＝你在券商 App 里预先设好「价格达到 X 就自动按设定下单」的指令。本助手只输出触发价和股数，不接券商、不自动下单、不监控盘中。',
  '同向过滤':'同向过滤＝条件计划里的每个动作，必须和当天的操作意见方向一致。例如当天意见是「减仓」，就不会出现任何买入分支；反向情景一律写「不操作」并给一句原因。',
  'L1/L2':'分级止损：L0 未破位（正常）；L1 趋势失效位被有效跌破 → 先减一部分、保留分红底仓；L2 在 L1 之后继续下跌 → 再清仓。轻度破位不会直接清仓。',
  'sector_strength':'板块强弱档＝用板块指数多日日线（价格 vs 均线、均线斜率）跑 2×2 四格得到的三档结论（偏强 / 中性 / 偏弱），用于建议层。与卡片上的「相对大盘单日差值 rs_t」是两套东西，不能互相代替。',
  '照抄设单':'照抄设单＝条件计划的每条分支按固定字段顺序给出「若…则买/卖 N 股」，股数已取整到 100 股/手，你不需要再换算金额，直接照着在券商 App 设条件单即可。',
  '阶段定位':'阶段定位＝先判断这只票现在处于什么状态：上升趋势（S1）/ 高位震荡（S2）/ 下跌趋势（S3）/ 低位筑底（S4）/ 无结构（S5）；数据不足时是 S0。不同阶段的打法完全不同：上升阶段回踩买、震荡阶段箱体做 T、下跌阶段只减不加、筑底阶段等右侧确认（或小仓试探）、无结构阶段不动。它是「先定打法」的前提，不是涨跌预测。',
  'S5 无结构':'S5 无结构＝有数据、但看不出方向：既没有趋势，也没有能画出上下沿的箱体（窄幅横盘、均线粘在一起）。这一档的结论就是不动——不新开仓、不做箱体价差。它不是「震荡」：震荡至少有可定义的边界。',
  '试探仓':'试探仓＝还没右侧确认时，只买一小笔（仅 S4 允许）：额度 ≤ 计划仓位 1/3、只买一次不补仓、跌破箱体下沿立刻清；确认反转后再补成正式仓。目的是不完全踏空，不是越跌越买。',
  '参数三档':'参数三档＝同一套规则的三套性格：宽松（少拦多做）、标准（默认，回测基线）、严格（宁可错过）。切档只换阈值，不换策略结构；也可以只改某一项（单项覆盖）。',
  '重大消息':'重大消息＝已公开的公告或事件（业绩预告、并购、立案、政策原文等）。本助手只说「有这件事、谁发的、什么时候」，不判利好利空、不因此改建议，由你自己判断。',
  '阶段门':'阶段门＝阶段定好之后，只允许这个阶段该做的动作。比如判为下跌趋势时，任何买入类动作都会被拦下改成「等待买点」或「减仓」。它只收紧、不放宽，也不改风险等级。',
  '缠论':'缠论＝用「中枢 + 走势类型（趋势/盘整）+ 背驰」判断买卖点的一套理论。本助手只借用它的两层内核：中枢≈箱体、走势类型≈趋势/盘整；更细的笔、线段、级别递归本期不做。',
  '背驰':'背驰＝价格创了新高（或新低），但推动它的动能没跟上，通常被视为转折提示。本助手只把它当观察注记，不单独触发买卖，因为它是否成立带有主观阈值。',
  '右侧确认':'右侧确认＝不猜底，等价格自己走出确认信号（站上 MA20 + 放量 + 突破箱体上沿）再买。对应的「左侧」就是还没确认就提前埋伏，本助手不做。'
};

 },o);

  ]};
 }

function comboCheck(h,branches){
 const buys=branches.filter(b=>b.action==='买入'||b.action==='试探建仓');
 if(!buys.length) return '<div class="combo-check"><b>组合校验提示</b>：本期无买入分支，无需进行组合额度校验（卖出分支只校验可卖持仓，不占用买入额度）。</div>';
 const sum=buys.reduce((a,b)=>a+b.amount,0), sumPct=+(sum/SNAP.total_capital*100).toFixed(1);
 const current=h.code==='600036'?12.8:4.1, after=+(current+sumPct).toFixed(1);
 if(after>20){
  return '<div class="combo-check"><b>组合校验提示 · 越界</b><br>若以上 '+buys.length+' 条买入分支同时触发：合计 <b>'+sum.toLocaleString()+' 元</b> / 总资金 <b>'+sumPct+'%</b>；叠加当前单只 '+current+'% 后为 <b>'+after+'% &gt; 单只 20% 上限</b>。<br><span class="check-no">同时执行会超出上限，请自行取舍。</span> 系统不设优先级、不删改任何分支股数、不代为决定。<br>参考组合（不越界）：仅执行分支 A（'+buys[0].shares+' 股 / '+buys[0].pct+'%），单只 '+(current+buys[0].pct).toFixed(1)+'% ≤ 20%、总仓 67.9% ≤ 80%、现金 32.1% ≥ 20%。<b>仅供参考，系统不代为决定。</b></div>';
 }
 return '<div class="combo-check"><b>组合校验提示 · 无越界</b><br>若以上 '+buys.length+' 条买入分支同时触发：合计 '+sum.toLocaleString()+' 元 / 总资金 '+sumPct+'%，叠加当前单只 '+current+'% 后为 '+after+'% ≤ 20%。<b>全部分支同时执行仍在硬上限内</b>（总仓 67.9% ≤ 80%、现金 32.1% ≥ 20%、T 仓 3.1% ≤ 10%）。各分支仍独立，由你自行取舍。</div>';
}

/* ---------- 飞书推送文本（§3.5.3.1：七段结构 + 图标语义，完整 / 精简两档） ---------- */
const FS_ACT={'买入':'➕','加仓':'➕','试探建仓':'➕','等待买点':'⏳','等待卖点':'⏳','减仓':'➖','清仓':'🔻','持有':'⏸','观望':'👀','不操作':'⏸','不可操作':'⛔','待同步':'⛔','无数据':'⛔'};
const FS_LV={severe:'🔴 严重',warn:'🟠 警示',observe:'🔵 观察',none:'⚪ 无'};
const FS_RANK={severe:0,warn:1,observe:2,none:3};
const FS_CNT={'减/清':'➖','加/建':'➕','持有':'⏸','观望':'👀','状态位':'⛔'};
const FS_EVENTS=[{lv:'A',code:'600036',name:'招商银行',title:'第十一届董事会第 8 次会议决议公告',time:'2026-11-10 18:32',src:'上交所'}];
function fsSign(pct){ if(pct===null||pct===undefined) return '—'; return (pct>0?'▲':pct<0?'▼':'—')+Math.abs(pct).toFixed(2)+'%'; }
function fsShort(t){ return String(t||'').split('；')[0].replace(/。$/,''); }
function fsClip(t,n){ t=String(t||''); if(t.length<=n) return t; const cut=t.slice(0,n); const p=Math.max(cut.lastIndexOf('，'),cut.lastIndexOf('、')); return (p>n*0.5?cut.slice(0,p):cut)+'…'; }
function fsBrief(t,n){ const a=String(t||'').split(' / '); return a.slice(0,n||2).join(' / ')+(a.length>(n||2)?'…':''); }
function fsRender(t){ return H(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
function feishuText(mode){
 mode=mode||'full';
 const full=mode!=='brief';
 const h=getH('600036'), plan=plansFor(h), st=stageOf('600036'), sd=STAGE_DEF[st.id];
 const setB=plan.branches.filter(b=>b.settable&&b.action!=='不操作');
 const holdB=plan.branches.filter(b=>!b.settable||b.action==='不操作');
 const buys=plan.branches.filter(b=>b.action==='买入'||b.action==='试探建仓');
 const sum=buys.reduce((a,b)=>a+b.amount,0), sumPct=+(sum/SNAP.total_capital*100).toFixed(1), after=+(12.8+sumPct).toFixed(1);
 /* 风险按标的归并：同一只股票只出现一次，取最高等级 */
 const byCode={};
 SNAP.holdings.forEach(x=>{ if(x.state!=='有效') return; riskRowsFor(x).forEach(r=>{ if(r.level==='none') return;
  const k=x.code; if(!byCode[k]) byCode[k]={code:k,name:x.name,level:r.level,items:[]}; byCode[k].items.push(r);
  if(FS_RANK[r.level]<FS_RANK[byCode[k].level]) byCode[k].level=r.level;
 });});
 const risks=Object.values(byCode).sort((a,b)=>FS_RANK[a.level]-FS_RANK[b.level]||a.code.localeCompare(b.code));
 const sigCount=risks.reduce((a,r)=>a+r.items.length,0), top=risks.slice(0,3);
 const L=[];
 /* ① 头部 */
 L.push('📊 **股票分析助手 · '+SNAP.next_trade_date+'**');
 L.push('🗓 基准 '+SNAP.data_date+' 收盘 ｜ 推送 '+SNAP.data_date+' 20:00 ｜ 适用 '+SNAP.next_trade_date+' ｜ 快照 '+SNAP.snapshot_id+' ｜ 版本 '+SNAP.calc_version+' ｜ 数据源 '+SNAP.source_tag);
 L.push('🔎 当日复盘：上期计划触发 1 / 未触发 2 / 跳空 0（仅回看，不构成新建议）');
 /* ② 一句话 */
 L.push('');
 L.push('🧭 **一句话**');
 L.push('上证 '+SNAP.market.main.close+'　'+fsSign(SNAP.market.main.pct)+'　环境「'+SNAP.market.regime.label+'」→ '+SNAP.market.regime.tempo);
 L.push('自选 '+SNAP.market.total+' 只：'+Object.keys(SNAP.market.counts).map(k=>(FS_CNT[k]||'•')+k+' '+SNAP.market.counts[k]).join('　'));
 /* ③ 风险 */
 L.push('');
 L.push('🔥 **今日风险 · '+risks.length+' 只（'+sigCount+' 条信号）**');
 if(!risks.length){ L.push('⚪ 今日无风险信号，按操作意见与条件计划执行'); }
 top.forEach(r=>{
  const main=r.items.find(i=>i.level===r.level)||r.items[0];
  if(full){
   L.push(FS_LV[r.level]+'｜**'+r.name+' '+r.code+'**');
   L.push('   依据：'+main.cat+'（'+fsClip(fsShort(main.basis),42)+'）');
   L.push('   影响：'+fsShort(main.action));
  }else{
   L.push(FS_LV[r.level]+'｜'+r.name+' '+r.code+'｜'+fsShort(main.action));
  }
 });
 if(risks.length>top.length){ L.push('⚪ 另有 '+(risks.length-top.length)+' 只观察级，见 WebUI 第 ⑨ 区块'); }
 /* ④ 待办 */
 L.push('');
 L.push('✅ **今日待办 · '+SNAP.todo_codes.length+' 只**');
 SNAP.todo_codes.forEach(c=>{
  const x=getH(c), ic=FS_ACT[x.advice]||'•';
  let tail='';
  if(x.state!=='有效'){ tail=(x.state==='不可操作'?'停牌，不可操作':'三元组不一致，今日不出计划'); }
  else{
   const p=plansFor(x);
   const b=p.branches.find(b=>b.action===x.advice&&b.shares>0)||p.branches.find(b=>b.shares>0);
   tail=x.advice+((b&&b.shares)?(' '+b.shares+' '+(b.unit||'股')):'')+(x.risk==='severe'&&x.advice!=='清仓'?'（含风险处置）':'');
  }
  L.push(ic+' '+c+' '+x.name+'　'+tail);
 });
 /* ⑤ 阶段 */
 L.push('');
 L.push('📍 **阶段 · '+h.name+' '+h.code+'**');
 if(full){
  L.push(st.id+' '+sd.name+'（置信度 '+st.conf+'）');
  L.push('打法：'+sd.play);
  L.push('➕ 允许：'+sd.allow);
  L.push('⛔ 禁止：'+sd.deny);
  L.push('🔔 切换：'+sd.next);
 }else{
  L.push(st.id+' '+sd.name+'（置信度 '+st.conf+'）｜'+fsShort(sd.play));
  L.push('⛔ 禁止：'+sd.deny);
 }
 /* ⑥ 条件计划 */
 L.push('');
 L.push('📋 **条件计划 · '+h.name+' '+h.code+'（'+st.id+' 模板）**');
 if(!setB.length){ L.push('⚪ 本阶段无可直接设单的分支，仅观察'); }
 setB.forEach((b,i)=>{
  if(full){
   L.push((i+1)+'、'+b.scenario+'｜'+b.trigger);
   L.push('   '+b.action+(b.shares?(' '+b.shares+' '+b.unit+' ≈ '+b.amount.toLocaleString()+' 元 · 占总资金 '+b.pct+'%'):''));
   L.push('   有效期 '+SNAP.next_trade_date.slice(5)+' 当日 · 失效 '+fsBrief(b.invalidate,2));
  }else{
   L.push((i+1)+'、'+b.trigger+' → '+b.action+(b.shares?(' '+b.shares+' '+b.unit):'')+(b.amount?(' ≈ '+b.amount.toLocaleString()+' 元'):'')+'（'+SNAP.next_trade_date.slice(5)+' 有效）');
  }
 });
 if(full&&holdB.length){ L.push('   另 '+holdB.length+' 条情景不操作（'+holdB.map(b=>b.scenario).join(' / ')+'），不设单，详见 WebUI'); }
 /* 组合校验 */
 L.push('');
 L.push('⚠️ **组合校验**');
 if(full){
  L.push('   '+buys.length+' 条买入分支全触发 = '+sum.toLocaleString()+' 元 / 总资金 '+sumPct+'%；叠加当前单只 12.8% → '+after+'%'+(after>20?' > 20% 上限':' ≤ 20% 上限'));
  L.push('   → '+(after>20?'同时执行会超限，请自行取舍（系统不代为决定）':'全部分支同时执行仍在硬上限内'));
 }else{
  L.push('   '+buys.length+' 条全触发 = '+sum.toLocaleString()+' 元，叠加后单只 '+after+'%'+(after>20?' > 20% 上限，请自行取舍':' ≤ 20% 上限'));
 }
 /* 消息 */
 L.push('');
 L.push('💬 **消息 · 只推送、不判断**');
 const evs=FS_EVENTS.filter(e=>e.lv==='A').slice(0,full?3:1);
 if(evs.length){ evs.forEach(e=>{
  if(full){
   L.push('📌 '+e.name+'：'+e.title);
   L.push('   '+e.time+' · '+e.src+'　｜　是否影响由你判断，系统不改建议、不改计划');
  }else{
   L.push('📌 '+e.name+'：'+e.title+'（'+e.time.slice(5)+'）');
  }
 }); } else { L.push('⚪ 今日消息未取得'); }
 /* ⑦ 声明 */
 L.push('');
 L.push('━━━━━━━━━━━━━━');
 L.push('🔒 静态计划，需本人在券商端自行设单；工具不下单、不盯盘、开盘后不更新');
 L.push('ℹ️ 触发条件 / 股数 / 风险等级 / 数据日期为关键字段，渠道压缩时不得删减');
 L.push('⚠️ 仅供研究参考，不构成投资建议，不承诺收益');
 return L.join('\n');
}

/* ---------- 交互（事件委托） ---------- */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');
 const devBtn=e.target.closest('#deviceSeg button');
 if(devBtn){
  state.device=devBtn.dataset.device;
  $('#device').classList.toggle('phone',state.device==='phone');
  document.querySelectorAll('#deviceSeg button').forEach(b=>b.classList.toggle('on',b===devBtn));
  if(state.device==='phone')$('#appFrame').scrollTop=0; else window.scrollTo({top:0});
  updateFab();
  return;
 }
 if(e.target.id==='specBtn'){
  state.spec=!state.spec;document.body.classList.toggle('show-spec',state.spec);
  $('#specBtn').textContent='需求对照：'+(state.spec?'开':'关');$('#specBtn').classList.toggle('on',state.spec);return;
 }
 if(!el)return;
 const act=el.dataset.act;

 if(act==='modal-close'){ if(e.target.closest('[data-stop]') && e.target!==el){} else closeModal(); return; }
 if(act==='to-top'){
  if(state.device==='phone')$('#appFrame').scrollTo({top:0,behavior:'smooth'});
  else window.scrollTo({top:0,behavior:'smooth'});
  toast('已回到页首');
  return;
 }
 if(act==='reset'){state.tab='A';state.todoOnly=false;setView('A','600036','list');toast('已回到 Tab A · 大盘 · 板块');return;}
 if(act==='tab'){
  if(el.dataset.tab==='C'){toast('选股为下一阶段范围，本版不做（§3.4）');return;}
  state.tab=el.dataset.tab;setView(el.dataset.tab,'600036','list');return;
 }
 if(act==='back'){setView((state.from==='sector_card'||state.from==='market_summary')?'A':(state.tab||'B'),'600036','list');return;}

function copy(txt){
 const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
 try{document.execCommand('copy');}catch(err){}
 document.body.removeChild(ta);
}

/* URL 深链预览：?device=pc|phone&view=A|B|D&code=601088&from=list&spec=1 */
(function initFromUrl(){
 try{
  const q=new URLSearchParams(location.search);
  if(q.get('device')==='phone'){
   state.device='phone';$('#device').classList.add('phone');
   document.querySelectorAll('#deviceSeg button').forEach(b=>b.classList.toggle('on',b.dataset.device==='phone'));
  }
  const v=q.get('view');
  if(v==='A'||v==='B'){state.view=v;state.tab=v;}
  if(v==='D'){state.view='D';state.tab=q.get('tab')||'B';}
  if(q.get('code'))state.code=q.get('code');
  if(q.get('from'))state.from=q.get('from');
  if(q.get('spec')==='1'){state.spec=true;document.body.classList.add('show-spec');$('#specBtn').textContent='需求对照：开';$('#specBtn').classList.add('on');}
  const sc=parseInt(q.get('scroll')||'0',10);
  if(sc>0)setTimeout(()=>{
   const f=$('#appFrame');
   if(state.device==='phone'){const prev=f.style.scrollBehavior;f.style.scrollBehavior='auto';f.scrollTop=sc;f.style.scrollBehavior=prev;}
   else window.scrollTo(0,sc);
   updateFab();
  },80);
 }catch(e){}
})();
/* ---------- 浮动「回到页首」：锚在设备框右下角，滚动超过阈值才出现 ---------- */
function positionFab(){
 const fab=$('#fab'); if(!fab)return;
 const d=$('#device').getBoundingClientRect();
 const w=46,h=46,m=14;
 const left=Math.max(8,Math.min(window.innerWidth-8-w,d.right-m-w));
 const top=Math.max(8,Math.min(window.innerHeight-8-h,d.bottom-m-h));
 fab.style.left=Math.round(left)+'px';
 fab.style.top=Math.round(top)+'px';
}
function updateFab(){
 const fab=$('#fab'); if(!fab)return;
 const y=state.device==='phone'?$('#appFrame').scrollTop:(window.pageYOffset||document.documentElement.scrollTop||0);
 fab.classList.toggle('on',y>220);
 positionFab();
}
$('#appFrame').addEventListener('scroll',updateFab,{passive:true});
window.addEventListener('scroll',updateFab,{passive:true});
window.addEventListener('resize',updateFab);

render();
updateFab();
</script>
