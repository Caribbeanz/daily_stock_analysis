# 高抛低吸助手 · 四因子权重（FR-7 / P2.2 可对话或表单调节）
# ---------------------------------------------------------------------------
# 需求依据：FR-7.2「四个维度支持可调节权重；默认按偏技术面配置」。
# 本文件由 P2.2 的写入口（action_service → rule_override_service）维护；
# 手工编辑同样生效，改配置不需要改代码（NFR-6）。
#
# 维度键（固定四项，键名不可改）：
#   technical   技术面（K线/均线/KDJ/RSI/MACD/BOLL/量价/支撑压力）
#   market      行业 / 大盘 / 板块（指数趋势、板块轮动、行业景气度）
#   news        消息面（个股新闻 / 公告 / 情绪）
#   fundamental 基本面（估值、业绩；场内基金以跟踪指数/成分股+分红替代）
#
# 约束：四项合计必须为 1.0（写入口强校验；手工改错时读取端会按总和归一化兜底）。
# ---------------------------------------------------------------------------

version: 1

weights:
  technical: 0.45      # 技术面
  market: 0.25         # 行业 / 大盘 / 板块
  news: 0.15           # 消息面
  fundamental: 0.15    # 基本面
