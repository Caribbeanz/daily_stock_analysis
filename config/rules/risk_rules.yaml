# 高抛低吸助手 · 风控规则（P0）
# ---------------------------------------------------------------------------
# 所有阈值均为"建议默认值"，可随时调整；改本文件不需要改代码（NFR-6）。
# 需求依据：FR-9 风控规则（止损 / 分批止盈 / 仓位）；需求附录 · 默认参数表。
# ---------------------------------------------------------------------------

version: 1

# 止损：技术位为主，可叠加固定百分比；支持"缓冲 + ATR 自适应"放宽
stop_loss:
  mode: technical            # technical | percent | either（either = 两者取先触发）| atr
  ma: [5, 10, 20]            # 技术位止损参考均线
  prev_low_lookback: 20      # 结构前低回看天数
  percent: 0.08              # 百分比止损（mode=percent / either 时生效）
  # —— 止损放宽（2026-10-13 调参：降低高波动标的被"下影线扫损"）——
  buffer_pct: 0.02           # 技术位下方再留 2% 缓冲
  atr_period: 14             # ATR 周期
  atr_mult: 2.5              # > 0 启用：止损放宽到 min(技术位, close − 2.5×ATR)，随波动率自适应

# 分批止盈（FR-9.5，已确认阈值）
# 说明：目标价四档合计 2/3（第一目标带 10~15% 共 1/3，第二目标带 20~25% 共 1/3），
#       剩余 1/3 交给"破线止盈 / 移动止盈"，避免一次清仓卖飞。
take_profit:
  targets: [0.10, 0.15, 0.20, 0.25]              # 目标价（相对成本涨幅）
  target_ratios: [0.1667, 0.1667, 0.1667, 0.1666]  # 各目标止盈比例（合计 ≈ 2/3）
  ma_break: [5, 10, 20]                          # 破线止盈参考均线
  ma_break_ratios: [0.333, 0.333, 0.334]         # 破线各 1/3（合计 1）
  trail:
    activate: 0.10         # 浮盈超过该值后启动移动止盈
    drawdown: 0.08         # 自持有期最高价回撤该幅度触发
  move_stop_to_cost_at: 0.10   # 浮盈超过该值，止损上移至成本（保本）

# 仓位管理（FR-9）
position:
  build_max: 0.30            # 首次建仓上限（占总仓）
  build_batches: 2           # 建仓分批数
  add_ladder: [0.30, 0.20, 0.10]   # 金字塔加仓：每档占总仓，越涨加得越少
  cap: 0.65                  # 单标的总仓位上限
  dip_buy_max: 0.25          # 抄底单笔上限
  dip_buy_batches: 2

# 紧急信号判定（用于 P1 推送分级；P0 先落库标记）
urgency:
  stop_loss_breach: true     # 触发硬止损 → 紧急
  ma20_breach: true          # 有效跌破 MA20 → 紧急
