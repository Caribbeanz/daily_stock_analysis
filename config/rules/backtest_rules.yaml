# 高抛低吸助手 · P1 上线前「规则体检」质量门配置（FR-12）
# ---------------------------------------------------------------------------
# 口径（v2，2026-10-13 修订）：**期望收益制**
#   四项全部满足才判定通过，才允许开启每日 20:00 推送：
#     ① 期望收益 > 0（单笔平均收益为正，策略正期望）
#     ② 盈亏比 ≥ 1.5（总盈利 / 总亏损）
#     ③ 最大回撤 ≤ 25%
#     ④ 样本数 ≥ 30
#   胜率对"截断亏损、让利润奔跑"的止损型趋势策略天然偏低，**降为参考项**；
#   如需恢复"胜率≥50%"硬门槛，把 min_win_rate 设为 0.5 即可。
# 修改本文件即可调整阈值，无需改代码（NFR-6）。
# ---------------------------------------------------------------------------
gate:
  min_expectation: 0.0    # 期望收益下限（单笔平均收益 %；> 0 即要求正期望）
  min_profit_factor: 1.5  # 盈亏比下限（总盈利 / 总亏损）
  max_drawdown: 0.25      # 最大回撤上限（0.25 = 25%）
  min_samples: 30         # 最小样本数
  min_win_rate: 0.0       # 0 = 不强制（胜率仅作参考）；设为 0.5 恢复"胜率≥50%"硬门槛

# 回测参数
backtest:
  horizon_days: 15        # 建仓后最长持有交易日
  warmup: 80              # 预热交易日（保证指标有效）
  fetch_days: 600         # 取数跨度；免费源（腾讯）单标的上限约 800 根 ≈ 3.2 年
