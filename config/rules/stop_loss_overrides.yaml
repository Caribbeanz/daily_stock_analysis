# 高抛低吸助手 · 单标的止损覆盖（FR-9 / P2.2「设置止损」）
# ---------------------------------------------------------------------------
# 用途：用户显式指定的止损价，**优先于**技术位/ATR 计算值。
# 需求依据：FR-9 风控规则（止损）、FR-14.3.3 对话写操作（设置止损）。
#
# 语义：
#   - 键为标的代码（大小写不敏感，比较时统一大写）；值为止损价（> 0）。
#   - 命中的标的在风控引擎里直接采用该止损价（mode 记为 readonly/override）。
#   - 未命中的标的仍走技术位 + ATR 自适应计算，**行为不变**（默认空表）。
#
# 本文件由 P2.2 写入口（action_service → rule_override_service）维护；
# 手工编辑同样生效，改配置不需要改代码（NFR-6）。
# ---------------------------------------------------------------------------

version: 1

overrides:
  # 示例（按需打开，注意去掉行首的 # 并保留缩进）：
  # 601919: 15.00
  # 513180: 0.480
